PLG_SYSTEM_MLSIGNUP_RATE_LIMIT="Signups per IP and hour"
PLG_SYSTEM_MLSIGNUP_RATE_LIMIT_DESC="Abuse protection (e.g. confirmation emails sent to third parties)."

